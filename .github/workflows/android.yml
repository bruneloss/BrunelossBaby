name: App Android e avisos

on:
  push:
    branches: [main, 'claude/**']
    paths: ['android/**', 'cloudflare/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      VERSAO_CODIGO: ${{ github.run_number }}
      URL_SITE: https://brunelossbaby-cantinho.pages.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }

      - name: Chave de assinatura (guardada na Cloudflare)
        if: env.CLOUDFLARE_API_TOKEN != '' && github.ref == 'refs/heads/main'
        run: bash cloudflare/scripts/chave.sh

      - name: Montar o APK
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: Guardar o APK no GitHub (para testes)
        uses: actions/upload-artifact@v4
        with:
          name: nosso-cantinho-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: Publicar na Cloudflare (site, APK, avisos e lembretes)
        if: env.CLOUDFLARE_API_TOKEN != '' && env.FIREBASE_SERVICE_ACCOUNT != '' && github.ref == 'refs/heads/main'
        run: bash cloudflare/scripts/publicar.sh

      - name: Falta configurar
        if: env.CLOUDFLARE_API_TOKEN == '' || env.FIREBASE_SERVICE_ACCOUNT == ''
        run: echo "::notice::APK montado, mas não publicado. Faltam os segredos CLOUDFLARE_API_TOKEN e/ou FIREBASE_SERVICE_ACCOUNT (Settings → Secrets → Actions)."
